<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Contact | Purr Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg: #FFF1F5; --pink-card: #FFFFFF; --pink-main: #FF8FAB;
    --pink-deep: #C2185B; --pink-soft: #FFD6E0; --pink-softer: #FFEAF0;
    --text-cocoa: #6B4552; --text-cocoa-light: #9C7684;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: linear-gradient(180deg, #FFF1F5 0%, #FFE3EC 100%);
    font-family:'Quicksand', sans-serif; color: var(--text-cocoa);
    display:flex; justify-content:center; padding: 32px 16px;
  }
  .wrap{ width:100%; max-width:600px; }
  nav{ display:flex; gap:18px; justify-content:center; margin-bottom:26px; flex-wrap:wrap; }
  nav a{
    color: var(--pink-deep); text-decoration:none; font-weight:700; font-size:14px;
    padding:6px 14px; border-radius:20px; background:#fff; box-shadow:0 2px 6px rgba(194,24,91,0.1);
  }
  nav a.active{ background: var(--pink-main); color:#fff; }
  .card{
    background: var(--pink-card); border-radius: 28px; padding: 32px 28px;
    box-shadow: 0 20px 50px rgba(194,24,91,0.12); border: 3px solid var(--pink-soft);
    text-align:center;
  }
  h1{ font-family:'Baloo 2', sans-serif; font-weight:800; color: var(--pink-deep); font-size:26px; margin-top:0; }
  p{ line-height:1.7; font-size:15px; }
  .email{
    display:inline-block; margin-top:14px; padding:10px 22px;
    background: var(--pink-softer); border-radius:20px; color: var(--pink-deep);
    font-weight:700; text-decoration:none;
  }
  .paws{ margin-top:24px; color: var(--pink-soft); letter-spacing:8px; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="index.html">Chat</a>
    <a href="about.html">About</a>
    <a href="privacy.html">Privacy policy</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
  <div class="card">
    <h1>Get in touch</h1>
    <p>Questions, feedback, or just want to say hi? I'd love to hear from you.</p>
    <a class="email" href="mailto:hello@example.com">hello@example.com</a>
    <div class="paws">🐾 🐾 🐾</div>
  </div>
</div>
</body>
</html>
