<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Purr Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg: #FFF1F5;
    --pink-card: #FFFFFF;
    --pink-main: #FF8FAB;
    --pink-deep: #C2185B;
    --pink-soft: #FFD6E0;
    --pink-softer: #FFEAF0;
    --text-cocoa: #6B4552;
    --text-cocoa-light: #9C7684;
    --gold: #FFC93C;
    --shadow: rgba(194, 24, 91, 0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: linear-gradient(180deg, #FFF1F5 0%, #FFE3EC 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--text-cocoa);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    position: relative;
    overflow-x:hidden;
  }
  .paw-field{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
  }
  .paw-field span{
    position:absolute; font-size:22px; color: var(--pink-soft); opacity:0.6;
  }
  .app{
    width: 100%;
    max-width: 460px;
    position: relative;
    z-index: 1;
  }
  .card{
    background: var(--pink-card);
    border-radius: 32px;
    box-shadow: 0 20px 50px var(--shadow);
    overflow: hidden;
    border: 3px solid var(--pink-soft);
  }
  .header{
    background: linear-gradient(135deg, var(--pink-main), #FFB3C6);
    padding: 28px 24px 22px;
    position: relative;
    text-align:center;
  }
  .header::before, .header::after{
    content:"";
    position:absolute;
    top:-14px;
    width:36px; height:40px;
    background: var(--pink-main);
    border-radius: 50% 50% 0 0;
  }
  .header::before{ left: 34px; transform: rotate(-18deg); background: linear-gradient(135deg, var(--pink-main), #FFB3C6);}
  .header::after{ right: 34px; transform: rotate(18deg); background: linear-gradient(135deg, var(--pink-main), #FFB3C6);}
  .avatar-wrap{
    width: 74px; height:74px;
    margin: 0 auto 10px;
    background: #fff;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 38px;
    box-shadow: 0 6px 14px rgba(194,24,91,0.18);
    border: 3px solid #fff;
    overflow: hidden;
  }
  .avatar-wrap img{
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: 24px;
    color: #fff;
    margin: 0;
    text-shadow: 0 2px 6px rgba(194,24,91,0.25);
    letter-spacing: 0.5px;
  }
  .subtitle{
    font-size: 13px;
    color: #FFF0F5;
    margin: 4px 0 0;
    font-weight: 600;
  }
  .status{
    display:inline-flex; align-items:center; gap:6px;
    margin-top: 10px;
    background: rgba(255,255,255,0.28);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#7CFFB2; box-shadow: 0 0 0 3px rgba(124,255,178,0.3);}
  .paw-divider{
    text-align:center;
    padding: 10px 0 0;
    font-size: 13px;
    color: var(--pink-soft);
    letter-spacing: 6px;
    background: var(--pink-softer);
  }
  .messages{
    background: var(--pink-softer);
    padding: 18px 18px 6px;
    height: 400px;
    overflow-y: auto;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .messages::-webkit-scrollbar{ width:6px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--pink-soft); border-radius: 10px; }
  .row{ display:flex; gap:8px; align-items:flex-end; }
  .row.user{ flex-direction:row-reverse; }
  .mini-avatar{
    width: 30px; height:30px; border-radius:50%;
    background: #fff; border: 2px solid var(--pink-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
    overflow: hidden;
  }
  .mini-avatar img{ width:100%; height:100%; object-fit:cover; }
  .row.user .mini-avatar{ background: var(--pink-main); border-color: var(--pink-main); }
  .bubble{
    max-width: 74%;
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.5;
    font-weight: 500;
    position: relative;
    animation: pop 0.22s ease;
  }
  @keyframes pop{ from{ transform: scale(0.9); opacity:0; } to{ transform: scale(1); opacity:1; } }
  .row.cat .bubble{
    background: #fff;
    color: var(--text-cocoa);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(194,24,91,0.08);
  }
  .row.user .bubble{
    background: linear-gradient(135deg, var(--pink-main), #FF6B9D);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .typing{ display:flex; gap:4px; padding: 4px 2px; }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--pink-main);
    animation: bounce 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform: translateY(0); opacity:0.5;} 30%{ transform: translateY(-5px); opacity:1;} }
  .input-bar{
    display:flex; gap:8px;
    padding: 14px 16px 18px;
    background: var(--pink-softer);
    border-top: 2px dashed var(--pink-soft);
  }
  .input-bar input{
    flex:1;
    border: none;
    border-radius: 22px;
    padding: 12px 18px;
    font-family:'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: #fff;
    color: var(--text-cocoa);
    outline: none;
    box-shadow: inset 0 0 0 2px var(--pink-soft);
  }
  .input-bar input:focus{ box-shadow: inset 0 0 0 2px var(--pink-main); }
  .input-bar input::placeholder{ color: var(--text-cocoa-light); }
  .send-btn{
    width: 46px; height:46px; flex-shrink:0;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--pink-main), #FF6B9D);
    color:#fff;
    font-size: 18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 10px rgba(194,24,91,0.28);
    transition: transform 0.15s ease;
  }
  .send-btn:hover{ transform: scale(1.08); }
  .send-btn:active{ transform: scale(0.94); }
  .send-btn:disabled{ opacity:0.5; cursor:default; transform:none; }
  .note{
    text-align:center;
    font-size: 11px;
    color: var(--text-cocoa-light);
    margin-top: 14px;
    font-weight:600;
  }
  nav{ display:flex; gap:18px; justify-content:center; margin-bottom:18px; flex-wrap:wrap; position:relative; z-index:1; }
  nav a{
    color: var(--pink-deep); text-decoration:none; font-weight:700; font-size:14px;
    padding:6px 14px; border-radius:20px; background:#fff; box-shadow:0 2px 6px rgba(194,24,91,0.1);
  }
  nav a.active{ background: var(--pink-main); color:#fff; }
</style>
</head>
<body>

<div class="paw-field" id="pawField"></div>

<div class="app">
  <nav>
    <a href="index.html" class="active">Chat</a>
    <a href="about.html">About</a>
    <a href="privacy.html">Privacy policy</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="card">
    <div class="header">
      <div class="avatar-wrap"><img src="https://i.pinimg.com/736x/98/7a/af/987aaff4f48759525d97d3723115038f.jpg" alt="Mochi the cat" /></div>
      <p class="title">Mochi</p>
      <p class="subtitle">your cozy cat companion</p>
      <div class="status"><span class="dot"></span>purring &amp; online</div>
    </div>
    <div class="paw-divider">🐾 🐾 🐾 🐾 🐾</div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Say hi to Mochi..." autocomplete="off" />
      <button class="send-btn" id="sendBtn" aria-label="Send">➤</button>
    </div>
  </div>
  <p class="note">made with 🩷 for cat lovers</p>
</div>

<script>
  const pawField = document.getElementById('pawField');
  const pawPositions = [
    [5,10],[90,15],[8,80],[92,75],[50,5],[15,45],[85,50],[45,90]
  ];
  pawPositions.forEach(([x,y]) => {
    const s = document.createElement('span');
    s.textContent = '🐾';
    s.style.left = x + '%';
    s.style.top = y + '%';
    pawField.appendChild(s);
  });

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const CAT_IMG = "https://i.pinimg.com/736x/98/7a/af/987aaff4f48759525d97d3723115038f.jpg";

  function addBubble(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'cat');
    const avatar = document.createElement('div');
    avatar.className = 'mini-avatar';
    if(role === 'user'){
      avatar.textContent = '🙂';
    }else{
      const img = document.createElement('img');
      img.src = CAT_IMG;
      img.alt = 'Mochi';
      avatar.appendChild(img);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row cat';
    row.id = 'typingRow';
    const avatar = document.createElement('div');
    avatar.className = 'mini-avatar';
    const typingImg = document.createElement('img');
    typingImg.src = CAT_IMG;
    typingImg.alt = 'Mochi';
    avatar.appendChild(typingImg);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  const REPLY_BANK = {
    greeting: [
      "hii there! 🐾 so happy you stopped by",
      "hello hello! Mochi is wide awake and ready to chat",
      "meow! good to see you 💕"
    ],
    howAreYou: [
      "I'm doing purr-fectly well, thanks for asking! how about you?",
      "feeling extra fluffy today. how's your day going?",
      "all curled up and cozy over here. what about you?"
    ],
    name: [
      "I'm Mochi, your resident cat friend 🐱",
      "the name's Mochi! nice to officially meet you",
      "Mochi, at your service, purr"
    ],
    love: [
      "aww, that makes my little cat heart so happy 🩷",
      "mrow~ right back at you",
      "you're making me blush under all this fur"
    ],
    sad: [
      "aww, sending you a big warm cuddle. want to tell me what's going on?",
      "I'm sorry you're feeling that way. I'm right here with you",
      "sending purrs your way. take your time, I'm listening"
    ],
    bored: [
      "ooh, want a game idea? I could tell you a fun fact, or we could just chat",
      "let's fix that! ask me something random and I'll do my best",
      "bored is just code for 'time for mischief'. what should we get into?"
    ],
    thanks: [
      "of course! that's what I'm here for 🐾",
      "anytime! happy to help",
      "aww, you're welcome"
    ],
    bye: [
      "bye for now! come back and chat again soon 💕",
      "take care! Mochi will be here, probably napping",
      "see you soon! stay cozy"
    ],
    default: [
      "tell me more about that!",
      "ooh interesting, I'm listening 🐾",
      "mrow, go on...",
      "that's fun to think about! what else is on your mind?",
      "I like where this is going, keep talking"
    ]
  };

  function pick(list){
    return list[Math.floor(Math.random() * list.length)];
  }

  function getScriptedReply(text){
    const t = text.toLowerCase();
    if(/\b(hi|hello|hey|meow)\b/.test(t)) return pick(REPLY_BANK.greeting);
    if(/how are you|how're you|how you doing/.test(t)) return pick(REPLY_BANK.howAreYou);
    if(/what.*(your name|are you called)|who are you/.test(t)) return pick(REPLY_BANK.name);
    if(/\b(love you|i love|cute|adorable)\b/.test(t)) return pick(REPLY_BANK.love);
    if(/\b(sad|upset|down|crying|lonely|stressed)\b/.test(t)) return pick(REPLY_BANK.sad);
    if(/\b(bored|boring|nothing to do)\b/.test(t)) return pick(REPLY_BANK.bored);
    if(/\b(thanks|thank you|thx)\b/.test(t)) return pick(REPLY_BANK.thanks);
    if(/\b(bye|goodbye|see you|gotta go)\b/.test(t)) return pick(REPLY_BANK.bye);
    return pick(REPLY_BANK.default);
  }

  function sendMessage(){
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    sendBtn.disabled = true;

    addBubble('user', text);
    addTyping();

    const delay = 500 + Math.random() * 600;
    setTimeout(() => {
      removeTyping();
      const replyText = getScriptedReply(text);
      addBubble('cat', replyText);
      sendBtn.disabled = false;
      inputEl.focus();
    }, delay);
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });

  addBubble('cat', "hii, I'm Mochi! 🐾 what's on your mind today?");
</script>

</body>
</html>
